[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decensio"
version = "0.1.0"
description = "Decensio : couverture et contrôle qualité pour le recensement et l'identification de la population."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propriétaire - tous droits réservés" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "shapely>=2.0",
  "numpy>=1.26",
  "rasterio>=1.3",
  "rapidfuzz>=3.6",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
decensio = "decensio.cli:main"

[tool.setuptools.packages.find]
include = ["decensio*"]

[tool.setuptools.package-data]
decensio = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
