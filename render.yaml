# Déploiement sur Render (https://render.com) : New > Blueprint, puis choisir ce dépôt.
services:
  - type: web
    name: decensio
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn decensio.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sante
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # URL de connexion PostgreSQL de Supabase (Project Settings > Database > Connection string).
      - key: DECENSIO_DATABASE_URL
        sync: false
      - key: DECENSIO_SECRET
        generateValue: true
      - key: DECENSIO_API_KEY
        generateValue: true
      - key: DECENSIO_STOCKER_NOMS
        value: "0"
